<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Density Simulator</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-color: #ffffff;
            --text-color: #2d3748;
            --primary-color: #3182ce;
            --border-color: #e2e8f0;
            --app-scale: 0.6; /* scale the whole app to 60% for embedding */
        }

        /* Wrapper to scale the entire app (useful when embedding in an iframe)
           width is expanded to compensate for the CSS scale so the layout doesn't get clipped */
        .app-wrapper {
            transform: scale(var(--app-scale));
            transform-origin: top center;
            width: calc(100% / var(--app-scale));
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: visible; /* allow scaled content to be visible when embedded */
        }

        .simulator-card {
            background-color: var(--card-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
            color: #1a202c;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #718096;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2b6cb0;
        }

        .canvas-container {
            position: relative;
            background-color: #1a202c;
            border-radius: 8px;
            overflow: hidden;
            height: 320px;
            margin-bottom: 24px;
            border: 3px solid #4a5568;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

<div class="app-wrapper">
<div class="simulator-card">
    <h2>Gas Density Simulator</h2>
    
    <div class="dashboard">
        <div>
            <div class="stat-label">Calculated Density (Mass / Volume)</div>
            <div id="density-display" class="stat-value">0.60</div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="control-header">
                <span>Mass (Particles)</span>
                <span id="mass-val">30</span>
            </div>
            <input type="range" id="mass-slider" min="10" max="100" value="30">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Volume</span>
                <span id="volume-val">50 mL</span>
            </div>
            <input type="range" id="volume-slider" min="20" max="100" value="50">
        </div>
    </div>
</div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const massSlider = document.getElementById('mass-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const densityDisplay = document.getElementById('density-display');

    const massVal = document.getElementById('mass-val');
    const volumeVal = document.getElementById('volume-val');

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let particles = [];
    const particleRadius = 4;
    const particleSpeed = 2.5;

    class Particle {
        constructor(maxX, maxY) {
            this.x = Math.random() * (maxX - particleRadius * 2) + particleRadius;
            this.y = Math.random() * (maxY - particleRadius * 2) + particleRadius;
            
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * particleSpeed;
            this.vy = Math.sin(angle) * particleSpeed;
        }

        update(pistonY) {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x - particleRadius < 0) {
                this.x = particleRadius;
                this.vx *= -1;
            } else if (this.x + particleRadius > canvas.width) {
                this.x = canvas.width - particleRadius;
                this.vx *= -1;
            }

            if (this.y + particleRadius > canvas.height) {
                this.y = canvas.height - particleRadius;
                this.vy *= -1;
            }

            if (this.y - particleRadius < pistonY) {
                this.y = pistonY + particleRadius;
                this.vy *= -1;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, particleRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#4299e1'; 
            ctx.fill();
            ctx.closePath();
        }
    }

    function syncParticles() {
        const targetCount = parseInt(massSlider.value);
        const volumeValue = parseInt(volumeSlider.value);
        const volumePct = volumeValue / 100;
        const pistonY = canvas.height * (1 - volumePct);

        while (particles.length < targetCount) {
            particles.push(new Particle(canvas.width, canvas.height));
        }
        if (particles.length > targetCount) {
            particles.length = targetCount;
        }

        particles.forEach(p => {
            if (p.y - particleRadius < pistonY) {
                p.y = pistonY + particleRadius + Math.random() * 5;
                p.vy = Math.abs(p.vy); 
            }
        });
    }

    function updateMetrics() {
        const mass = parseInt(massSlider.value);
        const volume = parseInt(volumeSlider.value);
        const density = (mass / volume).toFixed(2);

        densityDisplay.textContent = density;
        massVal.textContent = mass;
        volumeVal.textContent = volume + ' mL';
    }

    function drawChamberMarkings() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.font = '10px sans-serif';
        
        // Draw tick lines down the side of the container in mL
        for (let i = 1; i < 10; i++) {
            let y = (canvas.height / 10) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(15, y);
            ctx.stroke();
            
            ctx.fillText((100 - (i * 10)) + ' mL', 20, y + 3);
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const volumeValue = parseInt(volumeSlider.value);
        const volumePct = volumeValue / 100;
        const pistonY = canvas.height * (1 - volumePct);

        // 1. Draw volumetric scale lines in background
        drawChamberMarkings();

        // 2. Handle and draw gas molecules underneath
        syncParticles();
        particles.forEach(p => {
            p.update(pistonY + 14); // offset safely below piston face
            p.draw();
        });

        // 3. Draw Piston Apparatus
        // Draw the vertical center shaft/plunger
        ctx.fillStyle = '#718096';
        const shaftWidth = 20;
        ctx.fillRect((canvas.width / 2) - (shaftWidth / 2), 0, shaftWidth, pistonY);

        // Draw the handle on top of the plunger shaft
        ctx.fillStyle = '#4a5568';
        ctx.fillRect((canvas.width / 2) - 40, 0, 80, 8);

        // Draw the main horizontal piston head seal block
        ctx.fillStyle = '#4a5568';
        ctx.fillRect(0, pistonY, canvas.width, 14);

        // Draw a rubberized colorful bottom ring on the piston seal
        ctx.fillStyle = '#2d3748';
        ctx.fillRect(0, pistonY + 10, canvas.width, 4);

        requestAnimationFrame(animate);
    }

    massSlider.addEventListener('input', updateMetrics);
    volumeSlider.addEventListener('input', updateMetrics);

    updateMetrics();
    animate();
</script>

</body>
</html>
